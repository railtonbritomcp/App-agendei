    <meta name="theme-color" content="#0A1931">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      caches.keys().then((keyList) => {
        return Promise.all(keyList.map((key) => caches.delete(key)));
      });
    </script>
    <style>
        :root {
            --exec-navy: #0A1931;
            --exec-sapphire: #0F52BA;
            --exec-gold: #FFD700;
            --bg-light: #0A1931;
            --glass-bg: rgba(17, 34, 64, 0.75);
            --glass-border: rgba(255, 215, 0, 0.2);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-light);
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #root {
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(15, 82, 186, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(17, 34, 64, 0.8) 0%, transparent 60%),

        }
